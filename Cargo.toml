[package]
name = "sit-totp-for-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Lightweight native Windows tray app for SIT SHA-256 TOTP"
license = "MIT"
repository = "https://github.com/atuy1219/SIT-TOTP-For-Windows"

[dependencies]
hmac = "0.12.1"
sha2 = "0.10.9"
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
