name: Apply validation fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply windows-sys fixes
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path

          app = Path("src/windows_app.rs")
          text = app.read_text(encoding="utf-8")
          text = text.replace(
              "    CloseHandle, GetLastError, ERROR_ALREADY_EXISTS, HINSTANCE, HWND, LPARAM, LRESULT, POINT,\n    WPARAM,\n",
              "    CloseHandle, GetLastError, GlobalFree, ERROR_ALREADY_EXISTS, HINSTANCE, HWND, LPARAM,\n    LRESULT, POINT, WPARAM,\n",
          )
          text = text.replace(
              "    CreateFontW, DeleteObject, GetStockObject, DEFAULT_CHARSET, DEFAULT_GUI_FONT, FF_DONTCARE,\n    FW_BOLD, OUT_DEFAULT_PRECIS,\n",
              "    CreateFontW, DeleteObject, GetStockObject, UpdateWindow, CLEARTYPE_QUALITY,\n    CLIP_DEFAULT_PRECIS, DEFAULT_CHARSET, DEFAULT_GUI_FONT, FF_DONTCARE, FW_BOLD,\n    OUT_DEFAULT_PRECIS,\n",
          )
          text = text.replace(
              "use windows_sys::Win32::System::Memory::{\n    GlobalAlloc, GlobalFree, GlobalLock, GlobalUnlock, GMEM_MOVEABLE,\n};",
              "use windows_sys::Win32::System::Memory::{GlobalAlloc, GlobalLock, GlobalUnlock, GMEM_MOVEABLE};",
          )
          text = text.replace(
              "const WM_TRAY: u32 = WM_APP + 1;",
              "// Stable Win32 values kept local so extra API feature groups are unnecessary.\nconst COLOR_WINDOW_BRUSH: isize = 6; // COLOR_WINDOW + 1\nconst STATIC_CENTER_STYLE: u32 = 0x0000_0001; // SS_CENTER\nconst EDIT_SET_LIMIT_TEXT: u32 = 0x00C5; // EM_SETLIMITTEXT\nconst BUTTON_UNCHECKED: usize = 0; // BST_UNCHECKED\nconst BUTTON_CHECKED: usize = 1; // BST_CHECKED\nconst CLIPBOARD_UNICODE_TEXT: u32 = 13; // CF_UNICODETEXT\n\nconst WM_TRAY: u32 = WM_APP + 1;",
          )
          text = text.replace("hbrBackground: (COLOR_WINDOW + 1) as _,", "hbrBackground: COLOR_WINDOW_BRUSH as _,")
          text = text.replace("SS_CENTER as u32", "STATIC_CENTER_STYLE")
          text = text.replace("EM_SETLIMITTEXT", "EDIT_SET_LIMIT_TEXT")
          text = text.replace("BST_CHECKED as usize", "BUTTON_CHECKED")
          text = text.replace("BST_UNCHECKED as usize", "BUTTON_UNCHECKED")
          text = text.replace("BST_CHECKED as isize", "BUTTON_CHECKED as isize")
          text = text.replace("CF_UNICODETEXT", "CLIPBOARD_UNICODE_TEXT")
          text = text.replace(
              "        DEFAULT_CHARSET,\n        OUT_DEFAULT_PRECIS,\n        CLIP_DEFAULT_PRECIS,\n        CLEARTYPE_QUALITY,\n        FF_DONTCARE,",
              "        u32::from(DEFAULT_CHARSET),\n        u32::from(OUT_DEFAULT_PRECIS),\n        u32::from(CLIP_DEFAULT_PRECIS),\n        u32::from(CLEARTYPE_QUALITY),\n        u32::from(FF_DONTCARE),",
          )
          app.write_text(text, encoding="utf-8")

          store = Path("src/secret_store.rs")
          text = store.read_text(encoding="utf-8").replace(
              "use windows_sys::Win32::System::Memory::LocalFree;",
              "use windows_sys::Win32::Foundation::LocalFree;",
          )
          store.write_text(text, encoding="utf-8")

          license_file = Path("LICENSE")
          text = license_file.read_text(encoding="utf-8").replace(
              "Copyright (c) 2026 Yuta Akahoshi",
              "Copyright (c) 2026 atuy1219",
          )
          license_file.write_text(text, encoding="utf-8")
          '@
          python -c $script
      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows_app.rs src/secret_store.rs LICENSE
          if (-not (git diff --cached --quiet)) {
            git commit -m "Fix windows-sys 0.61 API imports"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          }
